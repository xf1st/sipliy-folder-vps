<!DOCTYPE html>
<html>
<head><meta charset="utf-8"/></head>
<body style="margin:0;background:#131313">
<canvas id="c" width="256" height="256"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// BG rounded rect
const r = 52;
ctx.beginPath();
ctx.moveTo(r,0); ctx.lineTo(256-r,0);
ctx.quadraticCurveTo(256,0,256,r);
ctx.lineTo(256,256-r); ctx.quadraticCurveTo(256,256,256-r,256);
ctx.lineTo(r,256); ctx.quadraticCurveTo(0,256,0,256-r);
ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
ctx.closePath();
const bgGrad = ctx.createLinearGradient(0,0,256,256);
bgGrad.addColorStop(0,'#1c1b1b'); bgGrad.addColorStop(1,'#201f1f');
ctx.fillStyle = bgGrad; ctx.fill();

// Cloud
const grad = ctx.createLinearGradient(44,112,180,168);
grad.addColorStop(0,'#a78bfa'); grad.addColorStop(1,'#7c3aed');
ctx.beginPath();
ctx.moveTo(76,168);
// Left arc (body of cloud)
ctx.arc(76,136,32,Math.PI*0.5,Math.PI*1.5);
ctx.arc(100,120,24,-Math.PI,0);
ctx.arc(134,112,36,-Math.PI,0);
ctx.arc(160,130,24,-Math.PI*0.5,Math.PI*0.5);
ctx.arc(180,148,20,-Math.PI*0.5,Math.PI*0.5);
ctx.lineTo(180,168);
ctx.closePath();
ctx.fillStyle = grad; ctx.globalAlpha=0.95; ctx.fill(); ctx.globalAlpha=1;

// Sync arrows (две стрелки ↓ и ↑)
ctx.strokeStyle = 'white'; ctx.lineWidth = 9;
ctx.lineCap = 'round'; ctx.lineJoin = 'round';

// Стрелка вниз (левая)
ctx.beginPath(); ctx.moveTo(100,160); ctx.lineTo(100,196); ctx.stroke();
ctx.beginPath(); ctx.moveTo(82,178); ctx.lineTo(100,196); ctx.lineTo(118,178); ctx.stroke();

// Стрелка вверх (правая)
ctx.beginPath(); ctx.moveTo(156,196); ctx.lineTo(156,160); ctx.stroke();
ctx.beginPath(); ctx.moveTo(138,178); ctx.lineTo(156,160); ctx.lineTo(174,178); ctx.stroke();

// Export PNG
const link = document.createElement('a');
link.download = 'icon.png';
link.href = c.toDataURL('image/png');
link.textContent = '⬇ Скачать icon.png';
link.style = 'color:#d2bbff;font-family:sans-serif;display:block;margin:8px;font-size:14px';
document.body.appendChild(link);
</script>
</body></html>
